<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Alexandre Cormeraie — applied AI for dev, design and the future of work">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD666" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#FF8AA8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#78AFFF" stop-opacity="0.20" />
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.15" fill="#FBFAF9" fill-opacity="0.13" />
    </pattern>
    <clipPath id="round"><rect x="0" y="0" width="1280" height="320" rx="0" /></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="320" fill="#0B0B0C" />
    <rect width="1280" height="320" fill="url(#wash)" />
    <rect width="1280" height="320" fill="url(#dots)" />

    <!-- The selection frame: the thing the whole body of work is about — pointing at
         something on a screen and being understood. -->
    <g transform="translate(946 74)" opacity="0.95">
      <rect x="0" y="0" width="252" height="172" rx="10" fill="#FFFFFF" fill-opacity="0.07" stroke="#0A84FF" stroke-width="2" />
      <g fill="#0A84FF">
        <rect x="-4.5" y="-4.5" width="9" height="9" />
        <rect x="247.5" y="-4.5" width="9" height="9" />
        <rect x="-4.5" y="167.5" width="9" height="9" />
        <rect x="247.5" y="167.5" width="9" height="9" />
      </g>
      <rect x="26" y="34" width="136" height="13" rx="6.5" fill="#FBFAF9" fill-opacity="0.22" />
      <rect x="26" y="62" width="200" height="13" rx="6.5" fill="#FBFAF9" fill-opacity="0.13" />
      <rect x="26" y="90" width="168" height="13" rx="6.5" fill="#FBFAF9" fill-opacity="0.13" />
      <rect x="26" y="124" width="88" height="26" rx="13" fill="#0A84FF" />
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="82" y="128" font-size="26" font-weight="700" fill="#4FA9FF" letter-spacing="3.4">BUILDING IN PUBLIC</text>
      <text x="80" y="196" font-size="62" font-weight="700" fill="#FBFAF9" letter-spacing="-2.4">Alexandre Cormeraie</text>
      <text x="82" y="242" font-size="25" font-weight="500" fill="#A2A7B0" letter-spacing="-0.3">Applied AI for dev, design and the future of work.</text>
    </g>
  </g>
</svg>
