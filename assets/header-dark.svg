<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t">
  <title id="t">Alexandre Cormeraie — Applied AI for dev, design and the future of work.</title>

